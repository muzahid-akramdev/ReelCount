name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: "false"

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Test and build
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:ktlintCheck :app:lintDebug :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: reelcount-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
